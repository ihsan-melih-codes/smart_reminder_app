name: smart_reminder_app
description: "Mobil Programlama II icin Flutter hatirlatici uygulamasi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Veritabani (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Bildirimler ve zaman yonetimi
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Ikonlar
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Kod ureticiler
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

  # Kod kalitesi
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
